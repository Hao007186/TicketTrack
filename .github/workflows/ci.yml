name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farewatch
          POSTGRES_PASSWORD: farewatch
          POSTGRES_DB: farewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U farewatch -d farewatch_test"
          --health-interval 2s
          --health-retries 15
    env:
      ENV: ci
      DATABASE_URL: postgresql+psycopg://farewatch:farewatch@localhost:5432/farewatch_test
      TEST_DATABASE_URL: postgresql+psycopg://farewatch:farewatch@localhost:5432/farewatch_test
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v
      # 前端型別由 openapi.json 產生；後端改了 API 卻沒更新它時擋下
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 型別檔要和 openapi.json 一致，避免改了 API 卻忘記重新產生
      - run: npm run gen:api
      - run: git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t farewatch-backend:ci backend
